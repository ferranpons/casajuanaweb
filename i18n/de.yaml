why1_title: "Persönliche Betreuung"
why1_body: "Sie sprechen mit Vanesa oder Ferran vor und während Ihres Aufenthalts. Wir koordinieren Ihre Ankunft und beantworten alle Fragen."
why2_title: "Lokale Empfehlungen"
why2_body: "Wir teilen die besten Orte in Cehegín, Caravaca und Nordwest-Murcia, die in keinem Reiseführer stehen."
