nearby_title: "Ausflugsziele rund um Casa Juana"
nearby_subtitle: "Von Cehegíns Altstadt aus können Sie einige der schönsten Ecken Nordwest-Murcias erkunden."
nearby1_title: "Altstadt Cehegín"
nearby1_body: "Mittelalterliche Gassen, Aussichtspunkte, Barockkirchen und Restaurants in wenigen Gehminuten."
nearby2_title: "Caravaca de la Cruz"
nearby2_body: "Heilige Stadt und unverzichtbares Ziel, nur 10 Minuten mit dem Auto entfernt."
nearby3_title: "Weinstraße Bullas"
nearby3_body: "Weingüter, Weinberge und kulinarische Erlebnisse etwa 20 Minuten entfernt."
nearby4_title: "Sierra de Burete"
nearby4_body: "Natur, Wandern und Ruhe für alle, die wirklich abschalten möchten."

faq_title: "Häufig gestellte Fragen"
faq1_q: "Wo liegt Casa Juana?"
faq1_a: "In der historischen Altstadt von Cehegín (Murcia), Calle Clavijo 5. 10 Minuten von Caravaca de la Cruz, 50 Minuten von Murcia."
faq2_q: "Wie viele Gäste können übernachten?"
faq2_a: "Das Haus hat 3 Schlafzimmer und bietet Platz für bis zu 6 Personen."
faq3_q: "Gibt es eine Klimaanlage?"
faq3_a: "Ja, Klimaanlage ist in allen Etagen vorhanden."
faq4_q: "Gibt es WLAN?"
faq4_a: "Ja, kostenloses Hochgeschwindigkeits-WLAN im ganzen Haus."
faq5_q: "Wo kann man parken?"
faq5_a: "Es gibt kostenloses Straßenparken sehr nah am Haus, in der Regel ohne Probleme verfügbar."
faq6_q: "Liegt es nahe bei Caravaca de la Cruz?"
faq6_a: "Ja, Caravaca de la Cruz — Heilige Stadt und UNESCO-Welterbe — liegt nur 10 Minuten mit dem Auto entfernt."
faq7_q: "Kann man per WhatsApp buchen?"
faq7_a: "Ja. Kontaktieren Sie uns unter +34 617 448 105 für Verfügbarkeitsanfragen oder Buchungen."
faq8_q: "Wie lautet die Stornierungsrichtlinie?"
faq8_a: "Kostenlose Stornierung bis 5 Tage vor Anreise bei den meisten Tarifen möglich."
