why1_body: "Direkt buchen vermeidet Provisionen der Agenturen. Sie zahlen genau dasselbe oder weniger."
why2_title: "Persönlicher Direktservice"
why2_body: "Sie sprechen direkt mit Vanesa oder Ferran. Wir geben lokale Tipps, koordinieren Ihre Ankunft und beantworten alle Fragen."
why3_title: "Flexible Termine"
why3_body: "Kontaktieren Sie uns auf WhatsApp für besondere Aufenthalte, späte Ankünfte oder sonstige Wünsche."
location_title: "Cehegín — Murcias bestgehütetes Geheimnis"
location_body: "<strong>10 Minuten von Caravaca de la Cruz</strong>, UNESCO-Weltkulturerbe, und <strong>50 Minuten von Murcia</strong>. Die Altstadt von Cehegín ist voll mit Barockkirchen, Aussichtspunkten und authentischer Küche, die man in Massentourismusführern nicht findet."
