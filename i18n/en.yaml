# FAQ inline
faq_title: "Frequently asked questions"
faq1_q: "Where is Casa Juana?"
faq1_a: "In the historic quarter of Cehegín (Murcia), at Calle Clavijo 5. 10 minutes from Caravaca de la Cruz and 50 minutes from Murcia city."
faq2_q: "How many guests can stay?"
faq2_a: "The house has 3 bedrooms and can accommodate up to 6 guests. Perfect for families, friend groups or couples."
faq3_q: "Is there air conditioning?"
faq3_a: "Yes, air conditioning is available on every floor for maximum comfort in summer."
faq4_q: "Is there WiFi?"
faq4_a: "Yes, free high-speed WiFi throughout the house."
faq5_q: "Where can I park?"
faq5_a: "There is free on-street parking very close to the house, usually available without problem."
faq6_q: "Is it close to Caravaca de la Cruz?"
faq6_a: "Yes, Caravaca de la Cruz — a Holy City and UNESCO World Heritage site — is just 10 minutes away by car."
faq7_q: "Can I book via WhatsApp?"
faq7_a: "Yes. You can contact us directly on +34 617 448 105 to check availability, make a booking or ask any question."
faq8_q: "What is the cancellation policy?"
faq8_a: "Free cancellation is available up to 5 days before arrival on most rates. Check the exact conditions when booking."
