nearby_title: "Cosa fare vicino a Casa Juana"
nearby_subtitle: "Dal centro storico di Cehegín puoi scoprire alcuni degli angoli più affascinanti del Nord-Ovest della Murcia."
nearby1_title: "Centro storico di Cehegín"
nearby1_body: "Vicoli medievali, belvedere, chiese barocche e ristoranti a pochi minuti a piedi."
nearby2_title: "Caravaca de la Cruz"
nearby2_body: "Città Santa e destinazione imperdibile, a soli 10 minuti in auto."
nearby3_title: "Strada del vino di Bullas"
nearby3_body: "Cantine, paesaggi di vigneti ed esperienze gastronomiche a circa 20 minuti."
nearby4_title: "Sierra de Burete"
nearby4_body: "Natura, escursioni e tranquillità per chi cerca di staccare davvero."

faq_title: "Domande frequenti"
faq1_q: "Dove si trova Casa Juana?"
faq1_a: "Nel centro storico di Cehegín (Murcia), a Calle Clavijo 5. A 10 minuti da Caravaca de la Cruz e a 50 minuti da Murcia."
faq2_q: "Quante persone possono soggiornare?"
faq2_a: "La casa ha 3 camere e può ospitare fino a 6 persone."
faq3_q: "C'è l'aria condizionata?"
faq3_a: "Sì, l'aria condizionata è disponibile in tutti i piani."
faq4_q: "C'è il WiFi?"
faq4_a: "Sì, WiFi ad alta velocità gratuito in tutta la casa."
faq5_q: "Dove si può parcheggiare?"
faq5_a: "C'è parcheggio gratuito in strada molto vicino alla casa, di solito disponibile senza problemi."
faq6_q: "È vicino a Caravaca de la Cruz?"
faq6_a: "Sì, Caravaca de la Cruz — Città Santa e Patrimonio dell'Umanità — è a soli 10 minuti in auto."
faq7_q: "Si può prenotare tramite WhatsApp?"
faq7_a: "Sì. Contattaci al +34 617 448 105 per verificare disponibilità o effettuare una prenotazione."
faq8_q: "Qual è la politica di cancellazione?"
faq8_a: "Cancellazione gratuita disponibile fino a 5 giorni prima dell'arrivo sulla maggior parte delle tariffe."
