location_title: "Cehegín — il segreto meglio custodito di Murcia"
location_body: "A <strong>10 minuti da Caravaca de la Cruz</strong>, Patrimonio dell'Umanità UNESCO, e a <strong>50 minuti da Murcia</strong>. Il centro storico di Cehegín è ricco di chiese barocche, belvedere e gastronomia autentica che non troverai nelle guide del turismo di massa."
