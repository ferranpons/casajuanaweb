location_title: "Cehegín, el secreto mejor guardado de Murcia"
location_body: "A <strong>10 minutos de Caravaca de la Cruz</strong>, Patrimonio de la Humanidad, y a <strong>50 minutos de Murcia capital</strong>. El casco histórico de Cehegín concentra iglesias barrocas, miradores y una gastronomía auténtica que no encontrarás en las guías de turismo masivo."
