# FAQ inline en homepage
faq_title: "Preguntas frecuentes"
faq1_q: "¿Dónde está Casa Juana?"
faq1_a: "En el casco histórico de Cehegín (Murcia), en la Calle Clavijo 5. A 10 minutos de Caravaca de la Cruz y a 50 minutos de Murcia capital."
faq2_q: "¿Cuántas personas pueden alojarse?"
faq2_a: "La casa tiene 3 habitaciones y puede alojar hasta 6 personas. Ideal para familias, grupos de amigos o parejas."
faq3_q: "¿Tiene aire acondicionado?"
faq3_a: "Sí, la casa dispone de aire acondicionado en todas las plantas para garantizar el máximo confort en verano."
faq4_q: "¿Hay WiFi?"
faq4_a: "Sí, WiFi de alta velocidad gratuito en toda la casa."
faq5_q: "¿Dónde se puede aparcar?"
faq5_a: "Hay aparcamiento gratuito en la calle muy cerca de la casa, habitualmente disponible sin problema."
faq6_q: "¿Está cerca de Caravaca de la Cruz?"
faq6_a: "Sí, Caravaca de la Cruz — Ciudad Santa y Patrimonio de la Humanidad — está a solo 10 minutos en coche."
faq7_q: "¿Se puede reservar por WhatsApp?"
faq7_a: "Sí. Puedes contactarnos directamente al +34 617 448 105 para consultar disponibilidad, hacer una reserva o resolver cualquier duda."
faq8_q: "¿Cuál es la política de cancelación?"
faq8_a: "Cancelación gratuita disponible hasta 5 días antes de la llegada en la mayoría de tarifas. Consulta las condiciones exactas al reservar."
