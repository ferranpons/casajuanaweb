why_title: "¿Por qué reservar directamente?"
why1_title: "Mismo precio, sin intermediarios"
why1_body: "Al reservar directamente evitas las comisiones de las agencias. Pagas exactamente lo mismo o menos."
why2_title: "Atención directa y personal"
why2_body: "Hablas con Vanesa o Ferran. Te damos recomendaciones locales, coordinamos la llegada y resolvemos cualquier duda."
why3_title: "Flexibilidad en las fechas"
