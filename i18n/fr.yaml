nearby_title: "Que faire près de Casa Juana"
nearby_subtitle: "Depuis le quartier historique de Cehegín, vous pouvez découvrir quelques-uns des coins les plus charmants du Nord-Ouest de Murcie."
nearby1_title: "Vieille ville de Cehegín"
nearby1_body: "Ruelles médiévales, belvédères, églises baroques et restaurants à quelques minutes à pied."
nearby2_title: "Caravaca de la Cruz"
nearby2_body: "Ville Sainte et destination incontournable, à seulement 10 minutes en voiture."
nearby3_title: "Route des vins de Bullas"
nearby3_body: "Caves, paysages de vignobles et expériences gastronomiques à environ 20 minutes."
nearby4_title: "Sierra de Burete"
nearby4_body: "Nature, randonnée et tranquillité pour ceux qui cherchent à se ressourcer."

faq_title: "Questions fréquentes"
faq1_q: "Où se trouve Casa Juana ?"
faq1_a: "Dans le quartier historique de Cehegín (Murcie), Calle Clavijo 5. À 10 minutes de Caravaca de la Cruz et à 50 minutes de Murcie."
faq2_q: "Combien de personnes peuvent séjourner ?"
faq2_a: "La maison a 3 chambres et peut accueillir jusqu'à 6 personnes."
faq3_q: "Y a-t-il la climatisation ?"
faq3_a: "Oui, la maison dispose de la climatisation à tous les étages."
faq4_q: "Y a-t-il le WiFi ?"
faq4_a: "Oui, WiFi haut débit gratuit dans toute la maison."
faq5_q: "Où peut-on se garer ?"
faq5_a: "Il y a un stationnement gratuit dans la rue très près de la maison, généralement disponible sans problème."
faq6_q: "Est-ce proche de Caravaca de la Cruz ?"
faq6_a: "Oui, Caravaca de la Cruz — Ville Sainte et Patrimoine de l'Humanité — est à seulement 10 minutes en voiture."
faq7_q: "Peut-on réserver par WhatsApp ?"
faq7_a: "Oui. Contactez-nous directement au +34 617 448 105 pour vérifier les disponibilités ou faire une réservation."
faq8_q: "Quelle est la politique d'annulation ?"
faq8_a: "L'annulation gratuite est disponible jusqu'à 5 jours avant l'arrivée sur la plupart des tarifs."
